<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Le Moteur du Cinéma Viral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        .video-placeholder { background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); aspect-ratio: 16/9; }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <header class="mb-12 text-center">
        <h1 class="text-5xl font-extrabold tracking-tighter italic text-white mb-2">
            CLIP<span class="text-green-500 font-black">FOUND</span>
        </h1>
        <p class="text-gray-400 text-sm uppercase tracking-widest italic">The Viral Scene Engine</p>
    </header>

    <div class="w-full max-w-2xl relative mb-10">
        <input type="text" 
               placeholder="Tapez une réplique, un film ou une émotion..." 
               class="w-full bg-[#1a1a1a] border-none p-6 rounded-full text-xl neon-border focus:outline-none focus:ring-2 focus:ring-green-500 transition-all text-white px-10">
        <button class="absolute right-4 top-4 bg-green-500 text-black font-bold p-3 px-6 rounded-full hover:bg-green-400 transition-colors">
            GO
        </button>
    </div>

    <div class="w-full max-w-4xl video-placeholder rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center border border-gray-800">
        <div class="text-center p-10">
            <p class="text-gray-600 mb-4 italic">Le moteur de recherche est en cours de couplage avec l'IA...</p>
            <div class="animate-pulse flex space-x-4 justify-center">
                <div class="h-2 w-2 bg-green-500 rounded-full"></div>
                <div class="h-2 w-2 bg-green-500 rounded-full"></div>
                <div class="h-2 w-2 bg-green-500 rounded-full"></div>
            </div>
        </div>
    </div>

    <footer class="mt-20 text-gray-600 text-[10px] uppercase tracking-widest">
        &copy; 2026 ClipFound Labs - Private Alpha
    </footer>

</body>
</html>
