<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
    </style>
</head>
<body class="p-6 flex flex-col items-center">

    <header class="my-10 text-center">
        <h1 class="text-5xl font-black italic tracking-tighter">CLIP<span class="text-green-500">FOUND</span></h1>
        <p id="status" class="text-gray-500 text-xs mt-2 italic text-green-500">● Système Connecté</p>
    </header>

    <div class="w-full max-w-2xl mb-10">
        <input type="text" id="searchInput" oninput="search()" placeholder="Cherche : 'money', 'ocean' ou 'rabbit'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-5 rounded-2xl text-xl text-white focus:border-green-500 outline-none transition-all shadow-2xl">
    </div>

    <div id="resultArea" class="hidden w-full max-w-3xl flex flex-col items-center fade-in">
        <div class="w-full aspect-video rounded-3xl overflow-hidden neon-border bg-black">
            <video id="player" controls autoplay loop playsinline class="w-full h-full object-cover"></video>
        </div>
        <div class="mt-6 text-center">
            <h2 id="vTitle" class="text-2xl font-bold"></h2>
            <p id="vQuote" class="text-green-500 italic mt-2"></p>
        </div>
    </div>

    <script>
        let db = [];

        // CHARGEMENT DE LA BASE DE DONNÉES
        fetch('database.json')
            .then(response => response.json())
            .then(data => {
                db = data;
                console.log("Base de données chargée :", db.length, "scènes");
            });

        function search() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const area = document.getElementById('resultArea');
            const player = document.getElementById('player');

            if (query.length < 3) {
                area.classList.add('hidden');
                player.pause();
                return;
            }

            // On cherche dans les keywords du JSON
            const match = db.find(item => item.keywords.some(key => query.includes(key)));

            if (match) {
                area.classList.remove('hidden');
                if (player.src !== match.videoUrl) {
                    player.src = match.videoUrl;
                    player.play();
                }
                document.getElementById('vTitle').innerText = match.title;
                document.getElementById('vQuote').innerText = `"${match.quote}"`;
            }
        }
    </script>
</body>
</html>
