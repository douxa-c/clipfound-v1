<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        .gradient-text { background: linear-gradient(to right, #fff, #39ff14); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    </style>
</head>
<body class="p-6 flex flex-col items-center min-h-screen">

    <header class="my-10 text-center">
        <h1 class="text-5xl italic gradient-text">CLIPFOUND</h1>
        <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">Ultra-Fast Engine v1.6</p>
    </header>

    <div class="w-full max-w-2xl mb-10">
        <input type="text" id="searchInput" oninput="search()" placeholder="Cherche : 'money', 'coffee' ou 'ocean'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-5 rounded-2xl text-xl text-white focus:border-green-500 outline-none transition-all shadow-2xl">
    </div>

    <div id="resultArea" class="hidden w-full max-w-3xl flex flex-col items-center">
        <div class="w-full aspect-video rounded-3xl overflow-hidden neon-border bg-black">
            <video id="player" controls autoplay loop playsinline class="w-full h-full object-cover"></video>
        </div>
        <div class="mt-8 text-center px-4">
            <h2 id="vTitle" class="text-3xl font-bold text-white"></h2>
            <p id="vQuote" class="text-green-500 italic text-xl mt-3"></p>
            <button class="mt-10 bg-white text-black font-black py-4 px-10 rounded-full hover:bg-green-500 transition-all uppercase text-sm tracking-tighter">
                🚀 Viraliser sur TikTok
            </button>
        </div>
    </div>

    <script>
        // BASE DE DONNÉES INTÉGRÉE (INCASSABLE)
        const db = [
            { 
                keywords: ['ocean', 'mer'], 
                title: "Deep Ocean", 
                quote: "L'immensité bleue du prototype.", 
                url: "https://vjs.zencdn.net/v/oceans.mp4" 
            },
            { 
                keywords: ['money', 'argent', 'rich'], 
                title: "The Wolf of Wall Street", 
                quote: "I've been a rich man, and I've been a poor man.", 
                url: "https://raw.githubusercontent.com/the-coder-bull/test-video/main/wolf.mp4" 
            },
            { 
                keywords: ['rabbit', 'lapin'], 
                title: "Big Buck Bunny", 
                quote: "Animation Test Scene", 
                url: "https://www.w3schools.com/html/mov_bbb.mp4" 
            },
            { 
                keywords: ['coffee', 'cafe', 'closer'], 
                title: "Glengarry Glen Ross", 
                quote: "Coffee is for closers!", 
                url: "https://ia801509.us.archive.org/15/items/coffee-is-for-closers/coffee.mp4" 
            }
        ];

        function search() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const area = document.getElementById('resultArea');
            const player = document.getElementById('player');

            if (query.length < 3) {
                area.classList.add('hidden');
                player.pause();
                return;
            }

            const match = db.find(item => item.keywords.some(key => query.includes(key)));

            if (match) {
                area.classList.remove('hidden');
                if (player.src !== match.url) {
                    player.src = match.url;
                    player.load(); // Force le rechargement de la nouvelle vidéo
                    player.play().catch(e => console.log("Autoplay bloqué"));
                }
                document.getElementById('vTitle').innerText = match.title;
                document.getElementById('vQuote').innerText = `"${match.quote}"`;
            }
        }
    </script>
</body>
</html>
