<script>
    // Nouvelle base de données avec des liens vidéos directs
    const database = [
        { 
            keywords: ['money', 'argent', 'rich'], 
            title: "The Wolf of Wall Street", 
            quote: "I've been a rich man, and I've been a poor man.", 
            videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4" // LIEN TEST (À remplacer par nos fichiers)
        },
        { 
            keywords: ['sell', 'vendre', 'pen'], 
            title: "The Wolf of Wall Street", 
            quote: "Sell me this pen.", 
            videoUrl: "https://www.w3schools.com/html/movie.mp4" // LIEN TEST
        }
    ];

    function searchScene() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        // On cherche si un mot-clé correspond
        const result = database.find(item => item.keywords.some(key => input.includes(key)));
        
        const playerSection = document.getElementById('playerSection');
        const videoFrame = document.getElementById('videoFrame');

        if (result && input.length >= 3) {
            playerSection.classList.remove('hidden');
            // On remplace l'iframe par une balise vidéo pour plus de contrôle
            playerSection.innerHTML = `
                <div class="video-container shadow-2xl">
                    <video controls autoplay class="w-full h-full">
                        <source src="${result.videoUrl}" type="video/mp4">
                        Votre navigateur ne supporte pas la vidéo.
                    </video>
                </div>
                <div class="mt-6 text-center">
                    <h2 class="text-2xl font-bold text-green-500">${result.title}</h2>
                    <p class="text-gray-400 italic mt-2">"${result.quote}"</p>
                    <button class="mt-8 bg-white text-black font-bold py-3 px-8 rounded-full hover:bg-green-500 transition-all transform hover:scale-105">
                        🚀 GÉNÉRER POUR TIKTOK
                    </button>
                </div>
            `;
        }
    }
</script>
