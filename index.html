<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Ocean Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
        .video-container { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #222; }
        .gradient-text { background: linear-gradient(to right, #fff, #39ff14); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">

    <header class="mt-12 mb-12 text-center">
        <h1 class="text-6xl italic gradient-text">CLIPFOUND</h1>
        <div class="bg-green-500 text-black text-[10px] font-bold px-3 py-1 rounded-full mt-4 uppercase tracking-widest">Alpha v1.5 • Ocean Test</div>
    </header>

    <div class="w-full max-w-2xl mb-12">
        <input type="text" id="searchInput" onkeyup="searchScene()" placeholder="Tapez 'ocean'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-6 rounded-3xl text-xl text-white focus:border-green-500 outline-none transition-all shadow-2xl">
    </div>

    <div id="playerSection" class="hidden w-full flex flex-col items-center">
        <div id="videoContainer" class="video-container neon-border">
            <video id="mainVideo" controls autoplay loop playsinline class="w-full h-full object-cover">
                <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la vidéo.
            </video>
        </div>
        <div class="mt-8 text-center">
            <h2 class="text-3xl font-bold">Nature : L'Océan</h2>
            <p class="text-green-500 italic text-xl mt-2">"La preuve que le moteur ClipFound tourne !"</p>
        </div>
    </div>

    <script>
        function searchScene() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const playerSection = document.getElementById('playerSection');
            const video = document.getElementById('mainVideo');

            // Si l'utilisateur tape "ocean", on montre la vidéo
            if (input.includes('ocean')) {
                playerSection.classList.remove('hidden');
                video.play();
            } else if (input.length === 0) {
                playerSection.classList.add('hidden');
                video.pause();
            }
        }
    </script>
</body>
</html>
