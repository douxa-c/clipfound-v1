<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* RESTAURATION DU LOGO PREMIUM */
        .gradient-text { 
            background: linear-gradient(to right, #fff, #39ff14); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 15px; 
            font-weight: 900;
            font-style: italic;
        }

        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .video-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #222; }
        
        /* Animation d'apparition */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10 min-h-screen">

    <header class="mt-10 mb-12 text-center w-full">
        <h1 class="text-6xl md:text-7xl tracking-tighter gradient-text">
            CLIPFOUND
        </h1>
        <div class="block">
            <div class="bg-green-500 text-black text-[10px] md:text-[12px] font-bold px-4 py-1.5 rounded-full inline-block mt-4 tracking-widest uppercase shadow-[0_0_15px_rgba(57,255,20,0.4)]">
                Alpha v1.6 • Engine Final
            </div>
        </div>
    </header>

    <div class="w-full max-w-2xl mb-12 px-2">
        <input type="text" id="searchInput" oninput="search()" 
               placeholder="Tapez 'money', 'coffee' ou 'ocean'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-5 md:p-6 rounded-3xl text-lg md:text-xl focus:outline-none focus:border-green-500 transition-all text-white shadow-2xl hover:border-gray-700 outline-none">
    </div>

    <div id="resultArea" class="hidden w-full flex flex-col items-center fade-in">
        <div class="video-container shadow-2xl neon-border">
            <video id="player" controls autoplay loop playsinline class="w-full h-full object-cover"></video>
        </div>
        
        <div class="mt-8 text-center max-w-xl px-4">
            <h2 id="vTitle" class="text-2xl md:text-3xl font-bold text-white mb-2"></h2>
            <p id="vQuote" class="text-green-500 italic text-lg md:text-xl font-medium"></p>
            
            <button onclick="alert('IA de rendu vidéo en cours de connexion...')" class="mt-10 bg-white text-black font-black py-4 px-10 rounded-full hover:bg-green-500 transition-all transform hover:scale-105 active:scale-95 shadow-lg uppercase text-xs tracking-widest">
                🚀 Viraliser sur TikTok
            </button>
        </div>
    </div>

    <script>
        const db = [
            { 
                keywords: ['ocean', 'mer'], 
                title: "Nature : Deep Ocean", 
                quote: "L'immensité bleue du prototype.", 
                url: "https://vjs.zencdn.net/v/oceans.mp4" 
            },
            { 
                keywords: ['money', 'argent', 'rich'], 
                title: "The Wolf of Wall Street", 
                quote: "I've been a rich man, and I've been a poor man.", 
                url: "https://raw.githubusercontent.com/the-coder-bull/test-video/main/wolf.mp4" 
            },
            { 
                keywords: ['rabbit', 'lapin'], 
                title: "Big Buck Bunny", 
                quote: "Animation Test Scene", 
                url: "https://www.w3schools.com/html/mov_bbb.mp4" 
            },
            { 
                keywords: ['coffee', 'cafe', 'closer'], 
                title: "Glengarry Glen Ross", 
                quote: "Coffee is for closers!", 
                url: "https://ia801509.us.archive.org/15/items/coffee-is-for-closers/coffee.mp4" 
            }
        ];

        function search() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const area = document.getElementById('resultArea');
            const player = document.getElementById('player');

            if (query.length < 3) {
                area.classList.add('hidden');
                player.pause();
                return;
            }

            const match = db.find(item => item.keywords.some(key => query.includes(key)));

            if (match) {
                area.classList.remove('hidden');
                if (player.src !== match.url) {
                    player.src = match.url;
                    player.load();
                    player.play().catch(e => console.log("Autoplay bloqué"));
                }
                document.getElementById('vTitle').innerText = match.title;
                document.getElementById('vQuote').innerText = `"${match.quote}"`;
            }
        }
    </script>
</body>
</html>
