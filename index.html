<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Creator Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        .gradient-text { 
            background: linear-gradient(to right, #fff, #39ff14); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 15px; 
            font-weight: 900;
            font-style: italic;
        }

        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 30px rgba(57, 255, 20, 0.15); }
        .video-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #222; transition: all 0.5s ease; }
        
        /* Mode Vertical pour TikTok */
        .mode-tiktok { aspect-ratio: 9/16; max-width: 350px; }
        .mode-tiktok video { object-fit: cover; }

        .search-glow:focus { box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); border-color: #39ff14; }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10 min-h-screen">

    <header class="mt-10 mb-12 text-center w-full">
        <h1 class="text-6xl md:text-7xl tracking-tighter gradient-text">CLIPFOUND</h1>
        <div class="block">
            <div class="bg-green-500 text-black text-[10px] font-bold px-4 py-1 rounded-full mt-4 uppercase tracking-[0.2em]">
                CREATOR MODE ACTIVE
            </div>
        </div>
    </header>

    <div class="w-full max-w-2xl mb-12 px-2">
        <input type="text" id="searchInput" oninput="search()" 
               placeholder="Cherche : 'money', 'coffee'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-6 rounded-3xl text-xl search-glow transition-all text-white shadow-2xl outline-none">
    </div>

    <div id="resultArea" class="hidden w-full flex flex-col items-center animate-fade-in">
        <div id="vBox" class="video-container shadow-2xl neon-border">
            <video id="player" controls autoplay loop playsinline class="w-full h-full object-cover"></video>
        </div>
        
        <div class="mt-8 text-center max-w-xl px-4">
            <h2 id="vTitle" class="text-3xl font-bold text-white mb-2"></h2>
            <p id="vQuote" class="text-green-500 italic text-xl font-medium"></p>
            
            <div class="flex flex-wrap gap-4 justify-center mt-10">
                <button onclick="toggleTiktok()" class="bg-[#39ff14] text-black font-black py-4 px-8 rounded-xl hover:scale-105 transition-all uppercase text-xs">
                    📱 Format TikTok
                </button>
                <button onclick="downloadVideo()" class="bg-white text-black font-black py-4 px-8 rounded-xl hover:scale-105 transition-all uppercase text-xs">
                    📥 Télécharger
                </button>
            </div>
        </div>
    </div>

    <script>
        const db = [
            { keywords: ['ocean'], title: "Deep Ocean", quote: "L'immensité bleue.", url: "https://vjs.zencdn.net/v/oceans.mp4" },
            { keywords: ['money'], title: "Wolf of Wall Street", quote: "Rich vs Poor", url: "https://raw.githubusercontent.com/the-coder-bull/test-video/main/wolf.mp4" },
            { keywords: ['coffee'], title: "Glengarry Glen Ross", quote: "Coffee is for closers!", url: "https://ia801509.us.archive.org/15/items/coffee-is-for-closers/coffee.mp4" }
        ];

        function search() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const area = document.getElementById('resultArea');
            const player = document.getElementById('player');
            const match = db.find(item => item.keywords.some(key => query.includes(key)));

            if (match && query.length >= 3) {
                area.classList.remove('hidden');
                if (player.src !== match.url) {
                    player.src = match.url;
                    player.play();
                }
                document.getElementById('vTitle').innerText = match.title;
                document.getElementById('vQuote').innerText = `"${match.quote}"`;
            }
        }

        function toggleTiktok() {
            document.getElementById('vBox').classList.toggle('mode-tiktok');
        }

        function downloadVideo() {
            const videoUrl = document.getElementById('player').src;
            const a = document.createElement('a');
            a.href = videoUrl;
            a.download = 'clipfound-video.mp4';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
