<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFound | Viral Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .neon-border { border: 1px solid #39ff14; box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .video-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #222; }
        /* Correction du logo pour qu'il ne soit jamais coupé */
        .gradient-text { 
            background: linear-gradient(to right, #fff, #39ff14); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 10px; 
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10 min-h-screen">

    <header class="mt-8 mb-10 text-center w-full px-4">
        <h1 class="text-5xl md:text-7xl font-black tracking-tighter italic gradient-text">
            CLIPFOUND
        </h1>
        <br>
        <div class="bg-green-500 text-black text-[10px] md:text-[12px] font-bold px-4 py-1.5 rounded-full inline-block mt-4 tracking-widest uppercase shadow-[0_0_15px_rgba(57,255,20,0.4)]">
            Alpha v1.1 • No-Limit Engine
        </div>
    </header>

    <div class="w-full max-w-2xl mb-12 px-2">
        <input type="text" id="searchInput" onkeyup="searchScene()" 
               placeholder="Tapez 'money' ou 'sell'..." 
               class="w-full bg-[#111] border-2 border-gray-800 p-5 md:p-6 rounded-3xl text-lg md:text-xl focus:outline-none focus:border-green-500 transition-all text-white shadow-2xl hover:border-gray-700">
        <p class="text-gray-500 text-xs md:text-sm mt-4 text-center tracking-wide">Accès instantané à la base de données de films</p>
    </div>

    <div id="playerSection" class="hidden w-full flex flex-col items-center fade-in">
        <div id="videoContainer" class="video-container shadow-2xl neon-border">
            </div>
        
        <div class="mt-8 text-center max-w-xl px-4">
            <h2 id="clipTitle" class="text-2xl md:text-3xl font-bold text-white mb-2"></h2>
            <p id="clipQuote" class="text-green-500 italic text-lg md:text-xl font-medium"></p>
            
            <div class="flex flex-col md:flex-row gap-4 justify-center mt-10">
                <button onclick="alert('IA en cours de préparation pour le recadrage TikTok...')" class="bg-white text-black font-black py-4 px-10 rounded-full hover:bg-green-500 transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                    🚀 VIRALISER (TIKTOK)
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-auto pt-20 pb-10 text-gray-700 text-[10px] uppercase tracking-[0.3em]">
        ClipFound Labs &copy; 2026 • Propriété de ton Empire
    </footer>

    <script>
        // Base de données temporaire pour test
        const database = [
            { 
                keywords: ['money', 'argent', 'rich'], 
                title: "The Wolf of Wall Street", 
                quote: "I've been a rich man, and I've been a poor man.", 
                videoUrl: "https://vjs.zencdn.net/v/oceans.mp4" 
            },
            { 
                keywords: ['sell', 'vendre', 'pen'], 
                title: "The Wolf of Wall Street", 
                quote: "Sell me this pen.", 
                videoUrl: "https://www.w3schools.com/html/movie.mp4" 
            }
        ];

        function searchScene() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const result = database.find(item => item.keywords.some(key => input.includes(key)));
            
            const playerSection = document.getElementById('playerSection');
            const videoContainer = document.getElementById('videoContainer');

            if (result && input.length >= 3) {
                playerSection.classList.remove('hidden');
                
                // Injection du lecteur vidéo propre
                videoContainer.innerHTML = `
                    <video id="mainVideo" controls autoplay loop class="w-full h-full object-cover">
                        <source src="${result.videoUrl}" type="video/mp4">
                    </video>
                `;
                
                document.getElementById('clipTitle').innerText = result.title;
                document.getElementById('clipQuote').innerText = `"${result.quote}"`;
            } else if (input.length === 0) {
                playerSection.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
